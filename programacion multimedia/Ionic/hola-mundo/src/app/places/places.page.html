<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> {{titulo}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let place of places">
      <ion-avatar slot ="start">
        <ion-img [src]="place.imageURL" [routerLink]="['/places/place.detail']"></ion-img>
      </ion-avatar>
      <ion-label>{{place.title}}</ion-label>
      
      
    </ion-item>
  </ion-list>
</ion-content>
