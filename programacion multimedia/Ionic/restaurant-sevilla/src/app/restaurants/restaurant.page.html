<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>{{titulo}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
 
  <ion-list>
    <ion-item *ngFor ="let restaurant of restaurants" [routerLink]="['/restaurants', restaurant.id]">
      <ion-avatar slot="start">
        <ion-img [src]="restaurant.imageURL"></ion-img>
      </ion-avatar>
      <ion-label>
        {{restaurant.title}}
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="danger" (click)="newRestaurant()">
      <ion-icon name ="add"></ion-icon><p>New</p>
    </ion-fab-button>
  </ion-fab>

</ion-content>
