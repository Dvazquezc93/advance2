<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot="start">
      <ion-back-button defaultHref="/restaurants"></ion-back-button>
    </ion-button>
    <ion-title>{{restaurant.title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-img style="width: 1200px;height: 1200px; " [src]="restaurant.imageURL">
          
        </ion-img>
      </ion-col>
    </ion-row>
    <ion-row>
    <ion-col>
      <h1 class="ion-text-center">{{restaurant.title}}</h1>
    </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-list>
          <ion-item *ngFor="let comment of restaurant.comments"> {{comment}}</ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
