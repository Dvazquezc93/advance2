<body>
    <script>
        //Agrupacion
        const array =[10,20,30];
        const array2 =[0,...array,40,50];
        console.log(array2);
        //Expansion
        function sumarTodos(...num){
            let sum=0;
            for(let i=0; i<=num.length ;i++){
                sum=sum +num[i];
            }
            return sum;
        }
        console.log(sumarTodos(10,20,30,40));
    </script>
    
</body>
