<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>001 - Hola mundo</title>
    <style>
      p {
        padding: 20px 10px;
        background-color: #eee;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1 id="1"></h1>
    <p id="2"></p>
    <script>
        for (let i = 1; i <= 2; i++){ 
            if (i >= 2) {
                document.getElementById(i.toString()).innerHTML= "Hola mundo";
            }
            else{
                document.getElementById(i.toString()).innerHTML= "001: Hola mundo";
            }
        }
    </script>
  </body>
