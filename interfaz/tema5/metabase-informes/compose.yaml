services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: informes
      POSTGRES_PASSWORD: informes
      POSTGRES_DB: ventas
    volumes:
      - ./datos-postgres:/var/lib/postgresql/data
      - ./inicio.sql:/docker-entrypoint-initdb.d/inicio.sql
  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./datos-metabase:/metabase-data
    depends_on:
      - postgres